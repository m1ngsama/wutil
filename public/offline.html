<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#9a3412">
    <title>Offline | wutil</title>
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #fafaf9; color: #1c1917; }
      main { width: min(34rem, calc(100% - 2rem)); border-block: 1px solid #d6d3d1; padding: 3rem 0; }
      small { color: #9a3412; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: .75rem 0; font-family: Georgia, serif; font-size: clamp(2.5rem, 10vw, 4.5rem); line-height: 1; }
      p { max-width: 42ch; color: #44403c; line-height: 1.65; }
      a { display: inline-flex; min-height: 44px; align-items: center; margin-top: 1rem; color: #fafaf9; background: #9a3412; border-radius: .75rem; padding: 0 1rem; font-weight: 700; text-decoration: none; }
      @media (prefers-color-scheme: dark) { body { background: #11100f; color: #f5f5f4; } main { border-color: #44403c; } p { color: #d6d3d1; } }
    </style>
  </head>
  <body>
    <main>
      <small>Connection unavailable</small>
      <h1>You’re offline</h1>
      <p>This tool has not been cached on this device yet. Reconnect once and open it, then wutil can keep the visited page ready for later.</p>
      <a href="/">Open cached tools</a>
    </main>
  </body>
</html>
