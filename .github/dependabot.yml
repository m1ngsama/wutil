version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "10:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      next-stack:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
      npm-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "10:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
